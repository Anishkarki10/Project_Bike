<section class="form-card">

    <h2 class="form-title">
        Social Media
    </h2>

    <div class="space-y-4">

        <div>
            <label class="label">
                TikTok URL
            </label>

            <input
                class="field"
                type="url"
                name="tiktok"
                maxlength="255"
                value="{{ settings.tiktok or '' }}"
            >
        </div>

        <div>
            <label class="label">
                Facebook URL
            </label>

            <input
                class="field"
                type="url"
                name="facebook"
                maxlength="255"
                value="{{ settings.facebook or '' }}"
            >
        </div>

        <div>
            <label class="label">
                Instagram URL
            </label>

            <input
                class="field"
                type="url"
                name="instagram"
                maxlength="255"
                value="{{ settings.instagram or '' }}"
            >
        </div>

    </div>

</section>
