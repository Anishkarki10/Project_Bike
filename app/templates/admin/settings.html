{% extends 'admin/base.html' %}{% block title %}Settings — Admin{% endblock %}{% block content %}
<div><h1 class="font-display text-4xl font-extrabold">Settings</h1><p class="text-gray-500 mt-1">Manage business details shown on the public website.</p></div><form method="POST" enctype="multipart/form-data" class="space-y-6 mt-7 max-w-3xl"><section class="form-card"><h2 class="form-title">Business Information</h2><div class="grid sm:grid-cols-2 gap-4"><div class="sm:col-span-2"><label class="label">Business Name</label><input class="field" name="business_name" value="{{ settings.business_name or '' }}"></div><div><label class="label">Phone</label><input class="field" name="phone" value="{{ settings.phone or '' }}"></div><div><label class="label">Email</label><input class="field" type="email" name="email" value="{{ settings.email or '' }}"></div><div class="sm:col-span-2"><label class="label">Address</label><input class="field" name="address" value="{{ settings.address or '' }}"></div><div class="sm:col-span-2"><label class="label">Opening Hours</label><textarea class="field min-h-24" name="opening_hours">{{ settings.opening_hours or '' }}</textarea></div></div></section><section class="form-card"><h2 class="form-title">Social Media</h2><div class="space-y-4"><input class="field" name="tiktok" value="{{ settings.tiktok or '' }}" placeholder="TikTok URL"><input class="field" name="facebook" value="{{ settings.facebook or '' }}" placeholder="Facebook URL"><input class="field" name="instagram" value="{{ settings.instagram or '' }}" placeholder="Instagram URL"></div></section><section class="form-card"><h2 class="form-title">About Us</h2><textarea class="field min-h-40" name="about_content">{{ settings.about_content or '' }}</textarea></section><section class="form-card"><h2 class="form-title">Logo</h2><input class="file-field" name="logo" type="file" accept="image/*"><p class="text-xs text-gray-400 mt-2">Current path: {{ settings.logo }}</p></section><button class="btn-red px-8 py-3">Save Settings</button></form>
{% endblock %}
