<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Prevent admin login from appearing in search engines -->
    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Admin Login — Supa Auto Link
    </title>


    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='images/logo.png') }}"
    >


    <!-- TAILWIND -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- GOOGLE FONTS -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CUSTOM CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/site.css') }}"
    >

</head>


<body
    class="min-h-screen
           bg-[#111]
           flex items-center
           justify-center
           p-4"
>


<main
    class="w-full max-w-md
           bg-white rounded-3xl
           p-8 shadow-2xl"
>

    <!-- =================================================
         LOGO + HEADER
    ================================================== -->
    <div class="text-center">

        <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="Supa Auto Link"
            class="w-28 h-28 mx-auto object-contain"
        >

        <h1
            class="font-display text-3xl
                   font-extrabold mt-3"
        >
            Admin Portal
        </h1>

        <p class="text-gray-500 text-sm">
            Supa Auto Link Management
        </p>

    </div>


    <!-- =================================================
         FLASH MESSAGES
    ================================================== -->
    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            <div
                class="space-y-2 mt-5"
                aria-live="polite"
            >

                {% for category, message in messages %}

                    <div
                        role="alert"
                        class="
                            rounded-lg
                            px-4 py-3
                            text-sm font-medium

                            {% if category == 'success' %}

                                bg-green-50
                                border border-green-200
                                text-green-700

                            {% elif category == 'warning' %}

                                bg-yellow-50
                                border border-yellow-200
                                text-yellow-700

                            {% else %}

                                bg-red-50
                                border border-red-200
                                text-red-700

                            {% endif %}
                        "
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}

    {% endwith %}


    <!-- =================================================
         LOGIN FORM
    ================================================== -->
    <form
        method="POST"
        action="{{ url_for('admin.login') }}"
        class="space-y-4 mt-7"
        autocomplete="on"
    >

        <!-- =============================================
             CSRF TOKEN
        ============================================== -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <!-- =============================================
             EMAIL
        ============================================== -->
        <div>

            <label
                for="email"
                class="label"
            >
                Email
            </label>

            <input
                id="email"
                class="field"
                name="email"
                type="email"
                required
                maxlength="150"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                placeholder="Admin email"
            >

        </div>


        <!-- =============================================
             PASSWORD
        ============================================== -->
        <div>

            <label
                for="password"
                class="label"
            >
                Password
            </label>

            <input
                id="password"
                class="field"
                name="password"
                type="password"
                required
                maxlength="255"
                autocomplete="current-password"
                placeholder="••••••••"
            >

        </div>


        <!-- =============================================
             LOGIN BUTTON
        ============================================== -->
        <button
            type="submit"
            class="btn-red w-full py-3"
        >
            Login
        </button>

    </form>


    <!-- =================================================
         SECURITY NOTE
    ================================================== -->
    <p
        class="text-xs text-gray-400
               text-center mt-5"
    >
        Authorized administrators only.
    </p>


    <!-- =================================================
         BACK TO WEBSITE
    ================================================== -->
    <a
        href="{{ url_for('public.home') }}"
        class="text-center text-sm
               text-gray-500 hover:text-gray-900
               block mt-4 transition"
    >
        ← Back to website
    </a>

</main>


</body>

</html>
