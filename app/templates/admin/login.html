<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Supa Auto Link</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}"></head><body class="min-h-screen bg-[#111] flex items-center justify-center p-4"><div class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl"><div class="text-center"><img src="{{ url_for('static', filename='images/logo.png') }}" class="w-28 h-28 mx-auto object-contain"><h1 class="font-display text-3xl font-extrabold mt-3">Admin Portal</h1><p class="text-gray-500 text-sm">Supa Auto Link management</p></div>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="mt-5 rounded-lg bg-red-50 text-red-700 px-4 py-3 text-sm">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}<form method="POST" class="space-y-4 mt-7"><div><label class="label">Email</label><input class="field" name="email" type="email" required placeholder="admin@supautolink.com"></div><div><label class="label">Password</label><input class="field" name="password" type="password" required placeholder="••••••••"></div><button class="btn-red w-full py-3">Login</button></form><a href="{{ url_for('public.home') }}" class="text-center text-sm text-gray-500 block mt-5">← Back to website</a></div></body></html>
