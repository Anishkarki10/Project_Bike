<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>
        Too Many Requests — Supa Auto Link
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="min-h-screen
           bg-gray-50
           flex items-center
           justify-center
           px-4"
>

    <main class="text-center max-w-lg">

        <p
            class="text-red-600
                   font-bold
                   text-sm
                   tracking-[0.2em]"
        >
            ERROR 429
        </p>

        <h1
            class="text-4xl
                   font-bold mt-3"
        >
            Too Many Requests
        </h1>

        <p
            class="text-gray-500
                   mt-4 leading-7"
        >
            Too many requests were sent in a short
            period of time. Please wait before trying again.
        </p>

        <a
            href="{{ url_for('public.home') }}"
            class="inline-block
                   mt-7 px-6 py-3
                   bg-red-600
                   text-white
                   rounded-xl
                   font-semibold"
        >
            Go Home
        </a>

    </main>

</body>

</html>
