<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      <a href="{{ url_for('public.home') }}" class="flex items-center gap-3">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Supa Auto Link" class="w-14 h-14 object-contain">
        <div class="leading-tight hidden sm:block">
          <p class="font-display text-xl font-extrabold tracking-wide">SUPA AUTO LINK</p>
          <p class="text-[10px] tracking-[0.28em] text-gray-500">BUY • SELL • EXCHANGE</p>
        </div>
      </a>

      <nav class="hidden md:flex items-center gap-1 text-sm font-semibold">
        <a href="{{ url_for('public.home') }}" class="nav-link">Home</a>
        <a href="{{ url_for('public.bikes') }}" class="nav-link">Available Bikes</a>
        <a href="{{ url_for('public.about') }}" class="nav-link">About Us</a>
        <a href="{{ url_for('public.contact') }}" class="nav-link">Contact</a>
      </nav>

      <div class="hidden md:flex items-center gap-3">
        <a href="tel:{{ settings.phone if settings else '9860541990' }}" class="text-sm font-semibold text-gray-700 hover:text-red-600">☎ {{ settings.phone if settings else '9860541990' }}</a>
        <a href="{{ url_for('public.bikes') }}" class="btn-red">Browse Bikes</a>
      </div>

      <button data-menu-button class="md:hidden w-10 h-10 rounded-lg border border-gray-200 flex items-center justify-center" aria-label="Toggle navigation">☰</button>
    </div>
  </div>
  <div data-mobile-menu class="hidden md:hidden border-t border-gray-100 bg-white px-4 py-4 space-y-2">
    <a href="{{ url_for('public.home') }}" class="mobile-link">Home</a>
    <a href="{{ url_for('public.bikes') }}" class="mobile-link">Available Bikes</a>
    <a href="{{ url_for('public.about') }}" class="mobile-link">About Us</a>
    <a href="{{ url_for('public.contact') }}" class="mobile-link">Contact</a>
    <a href="tel:{{ settings.phone if settings else '9860541990' }}" class="btn-red block text-center mt-3">Call {{ settings.phone if settings else '9860541990' }}</a>
  </div>
</header>
